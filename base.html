{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мастер Пол</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>
<body>
    <header style="background: #F4E8D3; padding: 20px 0%;">
        <div class="flex-container">
            <img src="{% static 'images/master_pol.png' %}"
            alt="Logo"
            width="100"
            height="100">
            <h1 style="color: #67BA80; font-family: Segoe UI;">Мастер Пол</h1>
        </div>
        <div style="display:flex; gap: 30px;">
            <a href="{% url 'partners' %}" class="header-text">Список партнеров</a>
            <a href="{% url 'history' %}" class="header-text">История продукции</a>
        </div>


    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer style="background: #F4E8D3; padding: 20px 0%">
        <div class="footer-text">
            <p class="text" style="color: #67BA80; font-size: 18px;">- Компания Мастер Пол -</p>
        </div>
    </footer>
</body>
</html>
